<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>塔路 · 素材拼装预览</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:1600px;height:900px;overflow:hidden;font-family:"Microsoft YaHei",sans-serif;color:#202b3b}body{background:#131f2b}.screen{position:relative;width:1600px;height:900px;padding:18px;background:#131f2b}.paper{position:absolute;left:18px;top:18px;width:1230px;height:864px;overflow:hidden;background:#eee5d3 url("../map-parts-v2/paper-base.png") center/cover;border:1px solid #b69b6c}.paper:after{content:"";position:absolute;inset:8px;border:1px solid #baa981;pointer-events:none}.tower{position:absolute;left:-60px;bottom:30px;width:445px;height:740px;object-fit:contain;opacity:.48;pointer-events:none}.arcade{position:absolute;right:-65px;bottom:22px;width:340px;height:610px;object-fit:contain;opacity:.3;pointer-events:none}.heading{position:absolute;left:45px;top:32px}.eyebrow{font-size:12px;letter-spacing:6px;color:#8c794f;margin-bottom:12px}h1{font-family:"SimSun",serif;font-size:48px;letter-spacing:8px;margin:0;font-weight:normal}h1:after{content:"";display:block;width:130px;height:1px;background:#a98c56;margin-top:15px}.subtitle{font-size:15px;letter-spacing:5px;margin-top:13px;color:#706d71}.hint{position:absolute;right:30px;top:26px;color:#7a7880;font-size:12px}.floor-note{position:absolute;left:43px;bottom:50px;font-size:12px;line-height:2;color:#85818a;letter-spacing:2px}.net{position:absolute;inset:0;z-index:2}.node{position:absolute;width:64px;height:64px;transform:translate(-50%,-50%);z-index:3}.node img{width:100%;height:100%;object-fit:contain}.node.faded{opacity:.36}.ring{position:absolute;transform:translate(-50%,-50%);z-index:4;pointer-events:none;width:90px;height:90px}.ring.current{width:104px;height:104px}.tick{position:absolute;width:26px;height:26px;z-index:4}.node-label{position:absolute;transform:translateX(-50%);font-size:12px;letter-spacing:1px;color:#576873;z-index:5;background:rgba(243,235,221,.9);padding:3px 9px;border-radius:3px}.node-label.current-label{color:#96723a}.legend{position:absolute;left:330px;right:65px;bottom:32px;border-top:1px solid #c5b597;padding-top:16px;display:flex;justify-content:center;gap:25px;z-index:5}.legend span{display:flex;align-items:center;font-size:12px;gap:7px;color:#665f5a}.legend img{width:24px;height:24px;object-fit:contain}.right{position:absolute;top:18px;right:18px;width:318px;height:864px;border:1px solid #796445;color:#e7dcc5;background:linear-gradient(145deg,#1b2b39,#13212f);padding:31px 25px}.right:before{content:"";position:absolute;inset:7px;border:1px solid #3c4141;pointer-events:none}.kicker{font-size:11px;letter-spacing:4px;color:#8fa7b4}h2{font-family:"SimSun",serif;color:#c9ad79;font-size:28px;letter-spacing:4px;margin:13px 0 23px;font-weight:normal}.rule{height:1px;background:linear-gradient(90deg,#90774d,transparent);margin-bottom:24px}.location{font-size:12px;color:#a3b2b9;letter-spacing:2px}.room{font-size:22px;color:#efe5d0;margin:12px 0}.copy{color:#acb9c0;line-height:1.9;font-size:13px;margin:0}.status-list{margin-top:29px}.status{display:flex;align-items:center;gap:13px;margin:16px 0;font-size:13px;color:#c9c9bf}.status img{width:34px;height:34px;object-fit:contain}.status:first-child img{filter:brightness(1.2)}.bottom{position:absolute;left:25px;right:25px;bottom:27px}.button{border:1px solid #867046;padding:11px 12px;text-align:center;font-size:13px;letter-spacing:2px;color:#d7c296;background:#1c2a33;margin-top:10px}.artnote{margin-top:18px;color:#7e929f;font-size:11px;text-align:center;line-height:1.7}.types{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:27px;padding-top:24px;border-top:1px solid #3c454a}.type{display:flex;align-items:center;gap:9px;font-size:12px;color:#9faeb6}.type img{width:23px;height:23px;object-fit:contain;filter:brightness(0) saturate(100%) invert(80%) sepia(11%) saturate(586%) hue-rotate(359deg) brightness(89%) contrast(87%)}
</style></head><body><div class="screen"><div class="paper">
<img class="tower" src="../map-parts-v2/tower-left.png" alt=""><img class="arcade" src="../map-parts-v2/arcade-right.png" alt="">
<div class="heading"><div class="eyebrow">月 夜 尖 塔</div><h1>塔路</h1><div class="subtitle">循着月光，继续向上</div></div>
<div class="hint">局部路线示意</div><div class="floor-note">按住地图拖动<br>查看更高的楼层</div>
<svg class="net" width="1230" height="864" viewBox="0 0 1230 864" xmlns="http://www.w3.org/2000/svg"></svg>
<div class="legend"><span><img src="../map-parts-v2/current-marker.png">当前位置</span><span><img src="../map-parts-v2/available-ring.png">可前往</span><span><img src="../map-parts-v2/completed-check.png">已走过</span><span style="color:#9a9591">····· 未走路线</span></div></div>
<aside class="right"><div class="kicker">月夜尖塔 · 路线</div><h2>移动消息</h2><div class="rule"></div><div class="location">当前位置</div><div class="room">事件房间</div><p class="copy">选择亮起的下一房间。</p><div class="status-list"><div class="status"><img src="../map-parts-v2/current-marker.png">金色标记 · 你在这里</div><div class="status"><img src="../map-parts-v2/available-ring.png">青色标记 · 可以前往</div></div><div class="types" id="types"></div><div class="bottom"><div class="button">整塔总览</div><div class="button">定位当前位置</div><div class="artnote">独立素材拼装预览<br>示意路线，尚未接入游戏</div></div></aside></div>
<script>
const icons="../map-icons-v1/", parts="../map-parts-v2/";
const nodes=[
["entry",620,735,"entrance","done"],
["b1",485,640,"battle","done"],["b2",805,640,"battle","faded"],
["here",485,537,"event","current"],["e2",950,537,"event","faded"],
["r1",355,434,"rest","available"],["b3",655,434,"battle","available"],["s1",975,434,"shop","normal"],
["el",400,330,"elite","normal"],["s2",745,330,"shop","normal"],["b4",1020,330,"battle","normal"],
["b5",450,226,"battle","normal"],["t1",790,226,"treasure","normal"],
["r2",625,124,"rest","normal"]
];
const edges=[["entry","b1","done"],["entry","b2","faded"],["b1","here","done"],["b2","e2","faded"],["here","r1","available"],["here","b3","available"],["e2","s1","faded"],["r1","el","normal"],["b3","el","normal"],["b3","s2","normal"],["s1","s2","normal"],["s1","b4","normal"],["el","b5","normal"],["s2","b5","normal"],["s2","t1","normal"],["b4","t1","normal"],["b5","r2","normal"],["t1","r2","normal"]];
const by=Object.fromEntries(nodes.map(n=>[n[0],n]));const svg=document.querySelector("svg");const paper=document.querySelector(".paper");const ns="http://www.w3.org/2000/svg";
for(const [a,b,status] of edges){const p=by[a],q=by[b];const dx=q[1]-p[1],dy=q[2]-p[2],len=Math.hypot(dx,dy),rad=30;const x=p[1]+dx/len*rad,y=p[2]+dy/len*rad,xx=q[1]-dx/len*rad,yy=q[2]-dy/len*rad;const path=document.createElementNS(ns,"path");path.setAttribute("d","M "+x+" "+y+" C "+x+" "+((y+yy)/2)+" "+xx+" "+((y+yy)/2)+" "+xx+" "+yy);path.setAttribute("fill","none");path.setAttribute("stroke",status==="done"?"#a68346":status==="available"?"#548e91":status==="faded"?"#afa89c":"#5c6470");path.setAttribute("stroke-width",status==="done"?"3":"2");path.setAttribute("stroke-linecap","round");if(status!=="done")path.setAttribute("stroke-dasharray","1 8");svg.appendChild(path);}
const cont=document.createElementNS(ns,"path");cont.setAttribute("d","M 625 87 L 625 42");cont.setAttribute("stroke","#9a958c");cont.setAttribute("stroke-width","2");cont.setAttribute("stroke-dasharray","1 8");cont.setAttribute("stroke-linecap","round");svg.appendChild(cont);
for(const [id,x,y,kind,status]of nodes){const n=document.createElement("div");n.className="node "+(status==="faded"?"faded":"");n.style.left=x+"px";n.style.top=y+"px";const im=document.createElement("img");im.src=(kind==="entrance"?parts:icons)+kind+".png";im.alt=kind;n.appendChild(im);paper.appendChild(n);if(status==="current"||status==="available"){const ring=document.createElement("img");ring.className="ring "+(status==="current"?"current":"");ring.src=parts+(status==="current"?"current-marker":"available-ring")+".png";ring.style.left=x+"px";ring.style.top=y+"px";paper.appendChild(ring);const label=document.createElement("div");label.className="node-label "+(status==="current"?"current-label":"");label.style.left=x+"px";label.style.top=(y+43)+"px";label.textContent=status==="current"?"当前位置":kind==="rest"?"休息":"战斗";paper.appendChild(label);}if(status==="done"){const tick=document.createElement("img");tick.className="tick";tick.src=parts+"completed-check.png";tick.style.left=(x+20)+"px";tick.style.top=(y+13)+"px";paper.appendChild(tick);}}
const types=[["battle","战斗"],["elite","精英"],["event","事件"],["shop","商店"],["treasure","宝箱"],["rest","休息"],["boss","双警卫"],["exit","出口"]];for(const [id,label]of types){const d=document.createElement("div");d.className="type";const im=document.createElement("img");im.src=icons+id+".png";d.appendChild(im);d.appendChild(document.createTextNode(label));document.getElementById("types").appendChild(d);}
window.artReady=Promise.all(Array.from(document.images).map(im=>im.decode().catch(()=>{document.body.dataset.failedImage=im.src;}))).then(()=>{document.body.dataset.ready="true";});
</script></body></html>
