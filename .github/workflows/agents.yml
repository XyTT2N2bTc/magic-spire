name: Agent instruction limits

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify checker boundaries
        run: python -m unittest discover -s tools -p 'test_check_agents.py'
      - name: Enforce AGENTS.md limits
        run: python tools/check_agents.py
